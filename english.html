<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172d29">
<title>English Practice | Chithambara Maths Challenge</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--ink:#172d29;--green:#126651;--mint:#e5f5ed;--paper:#f3f6f4;--line:#d9e4df;--muted:#45615a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 "Noto Sans Tamil",system-ui,sans-serif}header{background:#172d29;color:white}.bar,main,footer{max-width:1040px;margin:auto;padding:16px 24px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}.teacher{font-weight:500;font-size:.875rem;color:#d7e8e1}.badge{color:#172d29;background:#d8f795;padding:4px 12px;border-radius:100px;font-size:.875rem}.hero{position:relative;overflow:hidden;background:#e3f2e9;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,54px);margin:24px 0}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:12px 0}.hero p{max-width:560px;color:var(--muted)}.hero-art{position:absolute;right:35px;top:22px;color:#126651;font:bold clamp(42px,8vw,100px)/1 Georgia;opacity:.15;letter-spacing:-.1em;pointer-events:none}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:white;color:var(--ink);font-weight:700;min-height:44px}button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #ad5607;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,28px);margin-bottom:16px}h2,h3,p{margin-top:0}h2{line-height:1.5}h3{margin-bottom:12px}.eyebrow{color:var(--green);font-weight:750}.actions,.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.navigator{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.navigator button{padding:6px}.navigator .done{background:var(--mint);border-color:#94c9b5}.navigator [aria-current]{box-shadow: inset 0 0 0 2px var(--green)}label.option{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;min-height:48px;cursor:pointer}label.option:has(input:checked){background:var(--mint);border-color:var(--green)}input[type=radio]{accent-color:var(--green);width:18px;height:18px}input[type=text]{width:min(100%,320px);display:block;border:1px solid var(--muted);border-radius:10px;padding:10px;margin-top:8px}progress{display:block;width:100%;accent-color:var(--green);height:10px;margin:8px 0 18px}.stats>span{background:var(--mint);padding:8px 12px;border-radius:10px}.result-question{border-top:1px solid var(--line);padding:18px 0}.result-question h3{margin-bottom:8px}.result-question p,.result-question ol{margin-bottom:10px}.result-question ol{padding-inline-start:24px}.status{display:inline-block;margin-left:8px;font-size:.875rem;color:var(--muted)}.correct{color:var(--green)}.incorrect{color:#a43b21}footer{color:var(--muted);font-size:.875rem}dialog{width:min(480px,calc(100% - 32px));border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--ink)}dialog::backdrop{background:#172d2994}@media(max-width:720px){.layout{grid-template-columns:1fr}.bar,main,footer{padding-left:14px;padding-right:14px}.hero-art{right:20px}.navigator{grid-template-columns:repeat(10,1fr)}}@media(max-width:550px){.navigator{grid-template-columns:repeat(5,1fr)}}
:root{--ink:#122a23;--green:#145644;--paper:#f6f7f2;--line:#dde6dc;--muted:#405b51}
header{background:#102d25}.bar,main,.site-footer{max-width:1200px;margin:auto;padding-inline:clamp(16px,4vw,40px)}.bar{min-height:78px}.brand{display:flex;align-items:center;gap:12px}.brand strong{display:block;font:700 clamp(.9rem,2.4vw,1.15rem)/1.2 system-ui}.teacher{display:block;margin-top:4px}.badge{flex-shrink:0;background:#e4efa9;text-align:center}
.landing-hero{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:#103b2d;color:#fff;border-radius:26px;margin:20px 0 28px;min-height:430px}.landing-copy{align-self:center;padding:clamp(24px,5vw,64px)}.landing-copy .eyebrow{color:#ecf4be}.landing-copy h1{font-size:clamp(2rem,4.5vw,4rem);line-height:1.23;margin:14px 0;font-weight:800}.landing-copy p{color:#e0ece5;max-width:39ch;margin-bottom:25px}.landing-copy .primary{background:#e4efa9;border-color:#e4efa9;color:#123128}.landing-image{width:100%;height:100%;min-height:300px;object-fit:cover;display:block}.overview{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-bottom:28px}.overview .card{margin:0}.guide{display:grid;gap:15px;list-style:none;padding:0;margin:0}.guide li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}.guide li span:first-child{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--green);font-weight:800}.guide strong{display:block}.guide p{margin:3px 0 0;color:var(--muted)}.topics img{width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px}.topic-list{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}.topic-list li{background:#edf4eb;padding:5px 10px;border-radius:8px;font-size:.875rem}.site-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;padding-bottom:24px;border-top:1px solid var(--line)}
@media(max-width:750px){.landing-hero,.overview{grid-template-columns:1fr}.landing-hero{min-height:0}.landing-image{min-height:0;max-height:320px;aspect-ratio:16/9}.overview{gap:14px}}@media(max-width:400px){.badge{font-size:.75rem;padding-inline:8px}}

.portal-nav{display:flex;align-items:center;gap:clamp(8px,3vw,26px);flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,calc((100vw - 1120px)/2))}
.portal-nav a,.portal-login a{color:var(--green);font-weight:700}.portal-nav button{margin-left:auto}.portal-login{max-width:480px;margin:28px auto}.portal-login h1{margin:14px 0}.portal-login label{display:block;font-weight:700;margin-top:12px}.portal-login input{width:100%;padding:10px;border:1px solid var(--muted);border-radius:10px;margin:5px 0 0}.portal-login [role=alert]{min-height:1.65em;color:#a43b21;margin:9px 0}.portal-button,.portal-secondary{display:inline-flex;min-height:44px;align-items:center;border-radius:12px;padding:9px 13px;margin:2px 2px 2px 0;font-weight:700;text-decoration:none}.portal-button{background:#e4efa9;color:#123128}.portal-secondary{color:white;border:1px solid #a9c5b7}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}#portal-notice:not(:empty){padding:10px 18px;color:#a43b21}

.portal-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 12px;border-radius:10px;text-decoration:none}
.portal-nav a[aria-current="page"]{background:var(--mint);box-shadow:inset 0 -2px var(--green)}
.quiz-return{display:inline-flex;align-items:center;min-height:44px;color:var(--green);font-weight:700;margin-bottom:8px}
.quiz-card h2{font-size:clamp(1.2rem,2.5vw,1.55rem)}
.portal-login button,.dashboard-action{min-height:48px}
@media(max-width:600px){
  main{padding-top:8px}
  .bar{min-height:70px;gap:8px}
  .bar .badge{white-space:normal;max-width:112px}
  .portal-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px 12px}
  .portal-nav a{padding:6px 3px;text-align:center;font-size:.875rem;line-height:1.4}
  .portal-nav button{grid-column:1 / -1;margin:0;justify-self:end;font-size:.875rem}
  .landing-hero{margin:10px 0 16px;border-radius:18px}
  .landing-copy{padding:22px 18px}
  .landing-copy h1{font-size:clamp(1.7rem,8vw,2.35rem)}
  .landing-copy p{margin-bottom:14px}
  .landing-image{height:clamp(155px,48vw,245px);aspect-ratio:auto;object-position:center 52%}
  .entry-actions{display:grid;gap:8px}
  .entry-actions a{margin:0;justify-content:center;text-align:center;min-height:48px}
  .card,.hero{border-radius:16px;padding:16px;margin-bottom:12px}
  .hero{margin-top:12px}
  .hero h1,.portal-login h1{font-size:clamp(1.55rem,7vw,2rem)}
  .portal-login{margin-top:14px}
  .portal-login button,.dashboard-action,.navigator-card .actions button{width:100%}
  .layout{grid-template-columns:minmax(0,1fr);gap:4px}
  .quiz-card .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .quiz-card .actions button{padding:9px 5px;min-height:48px;font-size:.875rem}
  .navigator{grid-template-columns:repeat(5,minmax(0,1fr))}
  .navigator button{min-height:46px}
  .option{min-height:50px}
  .quiz-card input[type=text]{width:100%}
  dialog{max-height:calc(100dvh - 32px);overflow:auto}
  dialog .actions{display:grid;gap:8px}
  td,th{overflow-wrap:anywhere}
  .site-footer{display:grid;gap:5px}
}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><div><strong lang="en">Chithambara Maths Challenge</strong><span class="teacher">Teacher — <span lang="en">K. Kavithan</span></span></div></div><span class="badge">Demo quiz</span></div></header>
<nav class="portal-nav" aria-label="Main navigation">
  <a href="/">Home</a>
  <a href="/english">English Portal</a>
  <button id="logout" hidden>Log Out</button>
</nav>
<div id="portal-notice" role="status"></div>
<main id="app"></main>
<footer class="site-footer"><span lang="en">Chithambara Maths Challenge</span><span>Teacher — <span lang="en">K. Kavithan</span></span></footer>
<dialog id="submit-dialog" aria-labelledby="confirm-title">
<h2 id="confirm-title">Submit the quiz?</h2>
<p id="confirm-text"></p>
<form method="dialog" class="actions"><button value="cancel" autofocus>Keep Working</button><button class="primary" value="submit">Submit</button></form>
</dialog>
<script type="module">
let questions = [];
const app=document.querySelector('#app');
const dialog=document.querySelector('#submit-dialog');
let total = 0;
const key='english-maths-grade5-sanjee-v1';
const fresh=(screen='home')=>({screen,index:0,answers:Array(total).fill('')});
let state=fresh();
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}}
const answered=value=>value.trim()!=='';
const normalize=value=>value.trim().replace(/[௦-௯]/g,digit=>String(digit.charCodeAt(0)-0x0be6)).replace(/[,\s]/g,'').replace(/^0+(?=\d)/,'');
const count=()=>state.answers.filter(answered).length;
const status=(q,i)=>!answered(state.answers[i])?'unanswered':(q.options?state.answers[i]:normalize(state.answers[i]))===q.answer?'correct':'incorrect';
const labels={correct:'Correct',incorrect:'Incorrect',unanswered:'Unanswered'};
const escape=value=>value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const hero=(title,body)=>'<section class="hero"><span class="hero-art" aria-hidden="true">× +</span><div class="eyebrow">English Maths Practice</div><h1 tabindex="-1">'+title+'</h1>'+body+'</section>';
function render(focus=false){
  if(state.screen==='quiz'){
    const i=state.index,q=questions[i],value=state.answers[i];
    const control=q.options?q.options.map((option,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(value===String(j)?'checked':'')+'><span lang="en">'+option+'</span></label>').join(''):'<label for="numeric">Enter your answer as a number</label><input type="text" inputmode="numeric" autocomplete="off" id="numeric" maxlength="24" value="'+escape(value)+'">';
    app.innerHTML='<a class="quiz-return" href="/english">Back to English Portal</a><div class="layout"><section class="card quiz-card"><div class="eyebrow">'+q.topic+' · Question '+(i+1)+' / '+total+'</div><h2 tabindex="-1" id="question" lang="en">'+q.prompt+'</h2><div role="group" aria-labelledby="question">'+control+'</div><div class="actions"><button data-action="previous" '+(i===0?'disabled':'')+'>Previous Question</button>'+(i<total-1?'<button class="primary" data-action="next">Next Question</button>':'<button class="primary" data-action="review">Submit</button>')+'</div></section><aside class="card navigator-card"><h3>Questions</h3><p id="progress-label"></p><progress id="progress" max="'+total+'" aria-labelledby="progress-label"></progress><nav class="navigator" aria-label="Choose a question">'+questions.map((_,j)=>'<button data-action="jump" data-index="'+j+'" '+(i===j?'aria-current="step"':'')+'>'+(j+1)+'</button>').join('')+'</nav>'+(i<total-1?'<div class="actions"><button data-action="review">Submit</button></div>':'')+'</aside></div>';
    updateProgress();
  } else {
    const results=questions.map(status);
    const score=results.filter(value=>value==='correct').length;
    app.innerHTML='<a class="quiz-return" href="/english">Back to English Portal</a>'+hero('Your Results','<div class="stats"><span><strong>'+score+' / '+total+'</strong> points</span><span>'+results.filter(value=>value==='incorrect').length+' incorrect</span><span>'+(total-count())+' unanswered</span></div>')+
      '<section class="card"><h2>Answers and Explanations</h2>'+questions.map((q,i)=>{
        const value=state.answers[i];
        const response=answered(value)?(q.options?.[Number(value)]??escape(value)):labels.unanswered;
        return '<article class="result-question"><h3>Question '+(i+1)+' · '+q.topic+' <span class="status '+results[i]+'">'+labels[results[i]]+'</span></h3><p lang="en"><strong>'+q.prompt+'</strong></p><p>Your answer — '+response+'</p><p>Correct answer — <strong>'+q.solution+'</strong></p><h4>Explanation</h4><ol>'+q.steps.map(step=>'<li>'+step+'</li>').join('')+'</ol></article>';
      }).join('')+'<div class="actions"><button class="primary" data-action="start">Try Again</button></div></section>';
  }
  if(focus) app.querySelector('h1,h2')?.focus();
}
function updateProgress(){
  document.querySelector('#progress-label').textContent=count()+' / '+total+' answered';
  document.querySelector('#progress').value=count();
  app.querySelectorAll('[data-index]').forEach((button,i)=>{
    const done=answered(state.answers[i]);
    button.classList.toggle('done',done);
    button.setAttribute('aria-label','Question '+(i+1)+' · '+(done?'Answered':labels.unanswered));
  });
}
app.addEventListener('input',event=>{
  if(state.screen!=='quiz'||!event.target.matches('#numeric,input[name=answer]')) return;
  state.answers[state.index]=event.target.value;
  save();
  updateProgress();
});
app.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');
  if(!button || session?.role !== 'sanjee') return;
  switch(button.dataset.action){
    case 'resume': render(true); return;
    case 'start': state=fresh('quiz'); break;
    case 'previous': state.index--; break;
    case 'next': state.index++; break;
    case 'jump': state.index=Number(button.dataset.index); break;
    case 'review': {
      const remaining=total-count();
      document.querySelector('#confirm-text').textContent=remaining?remaining+' questions still unanswered. You can view your results after submitting.':'You have answered every question. Submit to see your results.';
      dialog.returnValue='';
      dialog.showModal();
      return;
    }
  }
  save();
  render(true);
});
dialog.addEventListener('close',()=>{
  if(dialog.returnValue!=='submit' || session?.role !== 'sanjee') return;
  state.screen='results';
  save();
  render(true);
});
const portal = 'english';
const activeNav = [...document.querySelectorAll('.portal-nav a')].find(link => link.pathname === '/' + portal);
activeNav?.setAttribute('aria-current', 'page');
let session;

function login(message = '') {
  app.innerHTML = `<section class="portal-login card">
    <a href="/">Home</a>
    <h1>English Practice Login</h1>
    <p>Sign in with your demo account.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" value="sanjee" autocomplete="username" required maxlength="32">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <p id="login-error" role="alert">${message}</p>
      <button class="primary">Log In</button>
    </form>
  </section>`;
}

function dashboard() {
  document.querySelector('#logout').hidden = false;
  const hasAttempt = ['quiz', 'results'].includes(state.screen);
  const summary = state.screen === 'results'
    ? questions.filter((q, i) => status(q, i) === 'correct').length + ' / ' + total + ' points'
    : count() + ' / ' + total + ' answered';
  const action = state.screen === 'results' ? 'View Results' : hasAttempt ? 'Resume Quiz' : 'Start Quiz';
  app.innerHTML = hero('English Practice Portal', '<p>' + escape(session.name) + ' · English Maths Practice</p>') +
    '<section class="card"><h2>Grade 5 Maths</h2><p>' + summary + '</p><button class="primary dashboard-action" data-action="' + (hasAttempt ? 'resume' : 'start') + '">' + action + '</button></section>';
}

async function portalRequest(body) {
  return fetch('/api/portal', body ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  } : { cache: 'no-store' });
}

async function enterPortal() {
  const response = await portalRequest();
  if (response.status === 401) return login();
  if (!response.ok) throw new Error('Portal unavailable');
  const account = await response.json();
  if (account.role !== 'sanjee') return login('Sign in with the account for this portal.');
  session = account;
  questions = session.questions;
  total = questions.length;
  state = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    if (saved && ['quiz','results'].includes(saved.screen) && Number.isInteger(saved.index) &&
      saved.index >= 0 && saved.index < total && saved.answers?.length === total &&
      saved.answers.every(value => typeof value === 'string')) state = saved;
  } catch {}
  dashboard();
}

app.addEventListener('submit', async event => {
  if (event.target.id !== 'login-form') return;
  event.preventDefault();
  const values = new FormData(event.target);
  const button = event.target.querySelector('button');
  const error = event.target.querySelector('[role=alert]');
  button.disabled = true;
  error.textContent = '';
  try {
    const response = await portalRequest({ action: 'login', portal, username: values.get('username').trim(), password: values.get('password') });
    if (response.status === 401) {
      error.textContent = 'The username or password is incorrect.';
      return;
    }
    if (!response.ok) throw new Error('Login unavailable');
    await enterPortal();
  } catch {
    error.textContent = 'Could not sign in. Please try again.';
  } finally {
    button.disabled = false;
  }
});
document.querySelector('#logout').addEventListener('click', async () => {
  try {
    const response = await portalRequest({ action: 'logout' });
    if (response.ok) location.assign('/');
    else throw new Error('Logout failed');
  } catch {
    document.querySelector('#portal-notice').textContent = 'Could not log out. Please try again.';
  }
});
app.innerHTML = '<p role="status">Loading portal…</p>';
enterPortal().catch(() => login('Could not load the portal. Please try again.'));
</script>
</body>
</html>
